# WebBench evaluation configuration
# Mirrors the config_swebench.yaml pattern: same providers, same model aliases.

webbench_options:
  use_stable_projects: true   # pass --use-stable-projects to webbench runner

# All providers are tested in a single webbench invocation (it handles internal parallelism).
# max_parallel is unused by run_webbench.py but kept for consistency.
max_parallel: 1

# Provider base URLs (OpenAI-compatible endpoints).
# These are embedded verbatim into model.json entries added at runtime.
base_urls:
  SambaNova: "https://api.sambanova.ai/v1"
  Fireworks: "https://api.fireworks.ai/inference/v1"
  Groq:      "https://api.groq.com/openai/v1"
  Cerebras:  "https://api.cerebras.ai/v1"
  Together:  "https://api.together.xyz/v1"
  Novita:    "https://api.novita.ai/openai/v1"
  Corethink: "https://api.corethink.ai/v1/sambanova/code"

# Environment variable name that holds the API key for each provider.
# The runner injects {{PROVIDER_API_KEY}} placeholders resolved by webbench's loadEnvForModels.
provider_api_keys:
  SambaNova: SAMBANOVA_API_KEY
  Fireworks: FIREWORKS_API_KEY
  Groq:      GROQ_API_KEY
  Cerebras:  CEREBRAS_API_KEY
  Together:  TOGETHER_API_KEY
  Novita:    NOVITA_API_KEY
  Corethink: CORETHINK_API_KEY

# Model mappings: provider → { alias: provider_specific_model_id }
# "not_available" entries are skipped.  Aliases become the webbench model title prefix.
